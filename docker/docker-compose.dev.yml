# 开发环境基础设施
# PostgreSQL 16 + PostGIS + Redis + EMQX + Kafka (KRaft)

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: uav-postgres
    environment:
      POSTGRES_DB: uav_ams
      POSTGRES_USER: uav
      POSTGRES_PASSWORD: uav123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uav -d uav_ams"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uav-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  emqx:
    image: emqx/emqx:5.3.2
    container_name: uav-emqx
    ports:
      - "1883:1883"
      - "8083:8083"     # 改映射：避免与 uav-risk-assessment(8083) 冲突，EMQX HTTP API
      - "18083:18083"   # Dashboard
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: admin123
    volumes:
      - emqxdata:/opt/emqx/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: uav-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTdENzlFQj"         # ★关键修复：KRaft 必须
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafkadata:/var/lib/kafka/data

volumes:
  pgdata:
  redisdata:
  emqxdata:
  kafkadata:
