# UAV Realtime Service 配置
mqtt:
  broker: tcp://172.27.19.223:1883
  client_id: uav-realtime
  username: ""
  password: ""
  qos: 1

websocket:
  port: 8090
  path: /ws
  origins: "*"

kafka:
  brokers:
    - 172.27.19.223:9092
  topic: uav.telemetry

redis:
  addr: 172.27.19.223:6379
  password: ""
  db: 0

# 百万级二进制聚合通道（独立于 websocket JSON 遥测，告警链路不受影响）
fleet:
  enabled: true
  port: 8091
  path: /fleet
  count: 100000      # 初始机群规模，运行时可 GET /resize?count=N 调整
  freq: 5.0          # 帧率 Hz
  lat: 39.9042
  lon: 116.4074
  radius: 50.0       # 活动半径 km
