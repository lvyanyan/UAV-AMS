server:
  port: 8088

spring:
  application:
    name: uav-flight-plan
  datasource:
    url: jdbc:postgresql://${DB_HOST:172.27.19.223}:${DB_PORT:5432}/${DB_NAME:uav_ams}
    username: ${DB_USER:uav}
    password: ${DB_PASS:uav123}
    driver-class-name: org.postgresql.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

flowable:
  # 首次启动自动建 ACT_ 表；升级时按 Flowable 官方升级流程处理
  database-schema-update: true
  # 审批任务为同步人工节点，不启用异步执行器
  async-executor-activate: false

logging:
  level:
    com.uav.flightplan: DEBUG
