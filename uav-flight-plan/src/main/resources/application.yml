server:
  port: 8088

spring:
  application:
    name: uav-flight-plan
  datasource:
    url: jdbc:postgresql://${DB_HOST:172.27.19.223}:${DB_PORT:5432}/${DB_NAME:uav_ams}
    username: ${DB_USER:uav}
    password: ${DB_PASS:uav123}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:172.27.19.223:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: flight-plan
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# 服务间调用（放行检查核验实名登记/驾驶员资质）
uav:
  services:
    registry-base-url: ${REGISTRY_BASE_URL:http://localhost:8086}
    pilot-base-url: ${PILOT_BASE_URL:http://localhost:8087}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

flowable:
  # 首次启动自动建 ACT_ 表；升级时按 Flowable 官方升级流程处理
  database-schema-update: true
  # 审批任务为同步人工节点，不启用异步执行器
  async-executor-activate: false

logging:
  level:
    com.uav.flightplan: DEBUG
